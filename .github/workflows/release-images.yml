name: Publish Docker images
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          number='0|[1-9][0-9]*'
          prerelease="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if ! [[ "$RELEASE_TAG" =~ ^v($number)\.($number)\.($number)(-$prerelease(\.$prerelease)*)?$ ]] || \
             (( ${#RELEASE_TAG} > 129 )); then
            printf 'Expected a semantic version tag, such as v0.1.0 or v0.1.0-rc.1.\n' >&2
            exit 1
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/typescript.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

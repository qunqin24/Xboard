name: xboard-typescript
services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xboard
      POSTGRES_PASSWORD: xboard_local
      POSTGRES_DB: xboard
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xboard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:

<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex,nofollow" />
        <meta
            name="description"
            content="Xboard 开发用户中心，查看账户、流量用量与套餐。"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <script>
            // Resolve the theme before first paint to avoid a flash; mirrors src/lib/theme.ts.
            (function () {
                var stored = null;
                try {
                    stored = localStorage.getItem("xboard-theme");
                } catch (e) {}
                var dark =
                    stored === "dark" ||
                    (stored !== "light" &&
                        matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.dataset.theme = dark
                    ? "dark"
                    : "light";
            })();
        </script>
        <title>Xboard · 用户中心</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

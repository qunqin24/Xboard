# Builds the single application image (apps/Dockerfile, target app: the API
# plus the built web app) for linux/amd64 and linux/arm64 on native runners.
# With push: false (pull requests) it is only built. With push: true each
# platform is pushed by digest, then one multi-arch index is tagged on GHCR as
# ghcr.io/<owner>/xboard with BuildKit SBOM and provenance attestations plus a
# signed GitHub build provenance attestation.
#
# Jobs here declare no permissions, so they get exactly what the calling job
# grants: contents: read to build; packages, id-token and attestations: write
# to publish.
name: Images
on:
  workflow_call:
    inputs:
      push:
        description: Push the images to GHCR and attest them.
        type: boolean
        required: true

env:
  # Tags for docker/metadata-action. A v1.2.3 tag produces 1.2.3, 1.2, 1 and
  # latest; a pre-release tag such as v1.2.3-rc.1 produces only 1.2.3-rc.1;
  # 0.x releases get no bare major tag; a push to main produces edge.
  IMAGE_TAGS: |
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
    type=edge,branch=main
  IMAGE_DESCRIPTION: Xboard subscription panel (API and web app in one image)

jobs:
  build:
    name: Build (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Name the image
        run: printf 'IMAGE=ghcr.io/%s/xboard\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.title=xboard
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          annotations: |
            org.opencontainers.image.title=xboard
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/Dockerfile
          target: app
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=app-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.platform.arch }}
      - if: inputs.push
        name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Name the image
        run: printf 'IMAGE=ghcr.io/%s/xboard\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE_TAGS }}
          annotations: |
            org.opencontainers.image.title=xboard
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
      - id: index
        name: Create the multi-arch index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation=" + .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          if (( ${#tags[@]} == 0 || ${#sources[@]} != 2 )); then
            printf 'Expected tags and two platform digests, got %s tags and %s digests.\n' "${#tags[@]}" "${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # Storage records only exist for organization-owned repositories.
          create-storage-record: false

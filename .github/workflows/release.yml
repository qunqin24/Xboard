# Pushing a v1.2.3 (or v1.2.3-rc.1) tag runs the full checks, publishes
# multi-arch images to GHCR and creates the GitHub Release. See
# docs/releases.md.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          number='0|[1-9][0-9]*'
          prerelease="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if ! [[ "$RELEASE_TAG" =~ ^v($number)\.($number)\.($number)(-$prerelease(\.$prerelease)*)?$ ]] || \
             (( ${#RELEASE_TAG} > 129 )); then
            printf 'Expected a semantic version tag, such as v0.1.0 or v0.1.0-rc.1.\n' >&2
            exit 1
          fi
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            printf 'prerelease=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prerelease=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the changelog entry
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if .github/scripts/release-notes.sh "$VERSION" >/dev/null; then
            exit 0
          elif [[ "$PRERELEASE" == true ]]; then
            printf '::notice::No CHANGELOG.md entry for %s; the release notes will list commits only.\n' "$VERSION"
          else
            exit 1
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml

  images:
    needs: [validate, checks]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/images.yml
    with:
      push: true

  github-release:
    name: Create GitHub Release
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write release notes
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            .github/scripts/release-notes.sh "$VERSION" || true
            printf '\n## Images\n\n```bash\n'
            printf 'docker pull ghcr.io/%s/xboard:%s\n' "$owner" "$VERSION"
            printf '```\n\nThe image serves the API and the web app and is built for linux/amd64 and linux/arm64. Verify the build provenance with\n'
            # shellcheck disable=SC2016 # Markdown backticks, not command substitution.
            printf '`gh attestation verify oci://ghcr.io/%s/xboard:%s --repo %s`.\n' "$owner" "$VERSION" "$GITHUB_REPOSITORY"
            printf '\nBack up PostgreSQL and the application key before upgrading. See the [release and upgrade guide](https://github.com/%s/blob/%s/docs/releases.md).\n' "$GITHUB_REPOSITORY" "$TAG"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf '::notice::Release %s already exists; leaving it unchanged.\n' "$TAG"
            exit 0
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${flags[@]}"

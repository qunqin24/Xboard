name: Feature request
description: Propose an improvement to Xboard.
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the expected outcome and any compatibility needs.

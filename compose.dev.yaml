# Isolated development only; this file does not target the production containers.
name: xboard-development

services:
  web:
    build:
      context: .
      target: app
    image: xboard-personal:dev
    init: true
    ports:
      - "127.0.0.1:${DEV_PORT:-17001}:7001"
    volumes: &app-volumes
      - ./.env:/www/.env
      - ./.docker/.data/dev-sqlite:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
    environment: &app-environment
      docker: "true"
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /www/.docker/.data/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      ENABLE_SQLITE: "true"
      ENABLE_REDIS: "false"
      ENABLE_CADDY: "false"
      ENABLE_HORIZON: "false"
      ENABLE_WS_SERVER: "false"
    command: php artisan octane:start --host=0.0.0.0 --port=7001
    depends_on:
      redis:
        condition: service_healthy

  horizon:
    image: xboard-personal:dev
    init: true
    volumes: *app-volumes
    environment:
      <<: *app-environment
      ENABLE_WEB: "false"
      ENABLE_HORIZON: "true"
    command: php artisan horizon
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev-redis:

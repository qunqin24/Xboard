name: Bug report
description: Report a reproducible problem. Use a private report for security issues.
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include deployment method, PostgreSQL version, browser or client, and node backend if relevant.
  - type: textarea
    id: steps
    attributes:
      label: Steps and result
      description: Describe what you did, what you expected, and what happened. Remove credentials, subscription links, and private user data.
    validations:
      required: true

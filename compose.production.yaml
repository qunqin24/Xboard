name: xboard-production
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: xboard
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: apps/Dockerfile
      target: api
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: &api-environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      DATABASE_URL: postgresql://xboard:${POSTGRES_PASSWORD}@postgres:5432/xboard
      TRUSTED_PROXY: 172.30.56.2
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/Dockerfile
      target: api
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - application-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.56.2

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.56.0/24
          ip_range: 172.30.56.128/25
volumes:
  application-data:
  database:
  caddy-data:
  caddy-config:

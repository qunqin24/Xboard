name: xboard-production
# One application container (API and web app) plus PostgreSQL. HTTPS is
# terminated by your own reverse proxy, which forwards to APP_BIND:APP_PORT.
# See docs/typescript-deployment.md.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: xboard
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    # XBOARD_IMAGE selects a published image, e.g. ghcr.io/qunqin24/xboard:1.2.3;
    # unset, Compose builds the image from this checkout.
    image: ${XBOARD_IMAGE:-xboard:local}
    build:
      context: .
      dockerfile: apps/Dockerfile
      target: app
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: &app-environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      DATABASE_URL: postgresql://xboard:${POSTGRES_PASSWORD}@postgres:5432/xboard
      # Connections through the published port arrive from the network
      # gateway, so X-Forwarded-For is trusted only from there.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.30.56.1}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  app:
    image: ${XBOARD_IMAGE:-xboard:local}
    build:
      context: .
      dockerfile: apps/Dockerfile
      target: app
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3001}:3001"
    volumes:
      - application-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.56.0/24
          gateway: 172.30.56.1
volumes:
  application-data:
  database:
